name: Backend security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-tests-only
          POSTGRES_DB: draugar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic-tests-only@127.0.0.1:5432/draugar_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm --filter @draugar/backend... install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @draugar/shared build
      - run: pnpm --filter @draugar/backend typecheck
      - run: pnpm --filter @draugar/backend build
      - run: pnpm --filter @draugar/backend test
